<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요소겹치기</title>
  <style>
    @import url(css/reset.css);
    .card{
      outline:1px solid red;
      width:50%;
      max-width:640px;/*최대 넓이를 이미지의 넓이값으로 설정(이미지의 해상도가 깨지지 않는다)*/
      margin:auto;
      position:relative;/*pos:abs를 적용한 자식요소의 기준이됨*/
    }
    .pic{
      display:block;
      width:100%;
      height:auto;/*기본값*/
    }

    .overlay{
      position:absolute;
      background-color:rgba(0,0,0,0.5);      
      inset:0; /* = left:0; top:0; right:0; bottom:0; */ 
      display:none;
    }
    .overlay > h2{
      color:white;
      font-size:60px;
      position:absolute;
      /*pos:abs를 적용했을때 가운데 정렬하는 방법*/
      top:50%; left:50%;
      translate: -50% -50%;
    }

    /*.card에 마우스를 올리면 .overlay가 화면에 나타납니다*/
    .card:hover > .overlay{
      display:block;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="pic" src="images/avatar.jpg" alt="Avatar">
    <div class="overlay">
      <h2>Hello</h2>
    </div>
  </div>
</body>
</html>
