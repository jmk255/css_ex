<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex속성</title>
  <style>
    @import url(css/reset.css);

    main{
      width:100%;
      height:100vh;/*뷰포트 높이의 100%로 설정*/
      background:lightcyan;
    }
    section{
      border:10px solid blue;
      display:flex;/*flex적용*/
      flex-direction: row;/*정렬방향을 변경하는 속성(row:가로축, column:세로축)*/
      flex-wrap:wrap;/*줄바꿈 허용*/
      justify-content: space-evenly;/*주축정렬*/
      align-content:stretch;/*교차축 정렬(여려줄)*/
      align-items:center;/*교차축 정렬(한줄)*/
      height:600px;
    }
    section > article{
      width:100px; height:100px;
      background:aqua;
      border:1px solid black;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <article></article>
      <article></article>
      <article></article>
      <article></article>
      <article></article>
    </section>
  </main>
</body>
</html>
