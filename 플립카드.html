<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플립카드</title>
  <style>
    .flip-card{
      background-color:transparent;
      width:300px;
      height:300px;
      border:1px solid #ccc;
      /*깊이감(z축으로 공간을 생성)*/
      perspective: 1000px;
    }
    .flip-card-inner{
      position:relative;
      width:100%;
      height:100%;
      text-align: center;
      /*자식요소들을 3d공간에 배치*/
      transform-style:preserve-3d;
      transition:transform 0.8s;/*transform속성에 변환효과 적용*/
    }

    .flip-card-front, 
    .flip-card-back{
      position:absolute;
      inset:0;
      /*뒷면을 투명하게 표시*/
      backface-visibility:hidden;
    }
    .flip-card-back{
      background-color:dodgerblue;
      color:#fff;
      /*뒷면은 뒤집어서 안보이게 설정*/
      transform:rotateY(180deg);
    }

    /*플립 상자 컨테이너 위로 마우스를 올리면 수평 뒤집기 수행*/
    .flip-card:hover .flip-card-inner{
      transform:rotateY(180deg);
    }
  </style>
</head>
<body>
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <img src="images/avatar.jpg" style="width:300px; height:300px; object-fit:cover; display:block;">
      </div>
      <div class="flip-card-back">
        <h1>John Doe</h1>
        <p>Architect &amp; Engineer</p>
        <p>We love that guy</p>
      </div>
    </div>
  </div>
</body>
</html>
