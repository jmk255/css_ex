<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>background연습3</title>
  <style>
    @import url(css/reset.css);

    .box{
      width:100%;
      height:400px;
      background-position: center; /*가운데 정렬*/
      background-size: cover;/*배경이미지를 요소에 가득채움*/
      background-repeat: no-repeat;/*반복배경 없음*/
      background-attachment: fixed;/*배경이미지 고정*/
      font-size:18px;
      color:#111;
    }
    .box1, 
    .box3{
      background-image:url(images/background-attachment_01.jpg);
    }

    .box2,
    .box4{
      padding:120px 0;
      box-sizing: border-box;/*높이가 padding값만큼 늘어나지 않게 제어합니다*/
    }
    .box > h1{
      font-size:32px;
      line-height:40px;
      text-align: center;
    }
    .box2 > p{
      text-align: center;
      line-height:1.5;
    }
    .box2 > p:nth-child(2){
      margin:20px 0;
    }

    .box4 > p{
      width:800px;
      margin:auto;
    }
    .box4 > p:nth-child(2){
      margin-top:40px;
    }

    .box5{
      height:520px;
      background-image: url(images/background-attachment_02.jpg);
    }
  </style>
</head>

<body>
  <div class="box box1"></div>
  <div class="box box2">
    <h1>BACKGROUND-ATTACHMENT</h1>
    <p>
      이 속성은 배경이미지를 어떻게 고정할지를 정하는 속성입니다.
    </p>
    <p>
      스크롤 하여 내용을 볼 때 배경 이미지가 내용과 같이 움직일지,<br>
      또는 배경 이미지는 고정되어 있을지 결정 할 수 있습니다. 
    </p>
  </div>
  <div class="box box3"></div>
  <div class="box box4">
    <h1>사용 가능 속성</h1>
    <p><b>scroll</b> : 기본 값입니다. 요소에 고정되어있습니다.</p>
    <p><b>local</b> : 요소 안 내용에 고정됩니다. 요소 안을 스크롤을 할 때, 이미지가 내부의 내용과 같이 움직입니다.</p>
    <p><b>fixed</b> : background-position의 좌표를 뷰포트(웹 페이지 화면)를 기준으로 합니다.</p>
  </div>
  <div class="box box5"></div>
</body>

</html>
