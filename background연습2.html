<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>background연습2</title>
  <style>
    @import url(css/reset.css);
    .bg{
      width:100%;
      min-width:800px;
      height:640px;
      background-image:url(images/background-image.jpg);
      background-position:center;/*배경이미지를 가운데로 정렬*/
      background-size:cover;/*요소안에 배경이미지를 가득채웁니다*/
      padding-top:120px;
      box-sizing:border-box;/*padding을 요소의 높이 안쪽으로 넣어서 높이가 padding값만큼 늘어나지 않게 설정해줍니다*/
    }
    .text-box{
      width:540px;
      height:240px;
      /*rgba의 a는 alpha채널로 배경색상의 투명도를 조절할때 사용*/
      background-color:rgba(255,255,255,0.4);
      border-radius:40px;/*모서리를 둥글게*/
      margin:auto;
      text-align: center;
      color:#333;
      padding:30px;
      box-sizing:border-box;
    }
    .text-box > h1{
      font-family: "휴먼둥근헤드라인";
      font-size:42px;
      letter-spacing: -1px;
      line-height:1.5em;
    }
    .text-box > p{
      font-family: "맑은 고딕";
      font-size:24px;
      margin-top:25px;
    }

  </style>
</head>
<body>
  <div class="bg">
    <div class="text-box">
      <h1>
        전좌석 안전띠 착용,<br>
        옵션이 아닌 필수 입니다
      </h1>
      <p>5년간 1,300명 안전띠 미착용으로 사망!</p>
    </div>
  </div>
</body>
</html>
