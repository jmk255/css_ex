<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>background속성</title>
  <style>
    .box{
      outline:1px solid red;
      width:100%;
      height:400px;
    }
    /*단일 배경 이미지*/
    .background-single{
      /*배경 이미지*/
      background-image: url("images/image1.jpg");
      /*배경이미지 크기 설정*/
      background-size:100% 400px;/*넓이(x축) 높이(y축)*/
      background-size:contain;/*배경을 사용하는 요소를 벗어나지 않는 최대 크기로 이미지를 확대 또는 축소, 가로세로 비율을 유지*/
      background-size:cover;/*이미지가 요소를 완전히 채우도록 설정, 가로세로 비율을 유지*/

      /*반복 배경 없음*/
      background-repeat:no-repeat;
    }

    /*배경이미지와 색상 혼합*/
    .background-image{
      background-color:rgba(0,0,0, 0.5);/*반투명 검정*/
      background-image:url(images/image1.jpg);
      background-size:cover;
      background-blend-mode:multiply;/*색상과 이미지 혼합 모드 설정*/
    }
    /*여러 배경 이미지*/
    .background-multiple{
      background-image:url(images/fire.jpg), url(images/image1.jpg);
      background-repeat: no-repeat;
      background-size:contain, cover;/*각 이미지의 크기 조절*/
      background-blend-mode: screen;
      background-position:right top, center center;/*각 이미지의 위치 조절*/
    }

    section{
      background-color:#fe9;
      background-repeat: no-repeat;
      width:300px; height:80px;
      margin-bottom:12px;
    }
    .one{
      background-image:url(images/spot.png);
      background-position: 10px bottom;
    }
    .two{
      background-image:url(images/spot.png);
      background-position: 3em 50%;
    }
    /*여러 배경 이미지*/
    .three{
      background-image:url(images/spot.png), url(images/logo.png);
      background-position:0 0,center;
    }
  </style>
</head>
<body>
  <div class="background-single box">
    <h1>TITLE</h1>
  </div>
  <div class="background-image box"></div>
  <div class="background-multiple box"></div>

  <section class="one">Example One</section>
  <section class="two">Example Two</section>
  <section class="three">Example Three</section>
</body>
</html>
