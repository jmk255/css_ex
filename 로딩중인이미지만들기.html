<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로딩중인 이미지 만들기</title>
  <style>
    @import url(css/reset.css);
    /*로딩 이미지*/
    #loading{
      background-color:#ddd;
      position:fixed;
      inset:0;
      display:flex;
      justify-content: center;
      align-items: center;
      transition:all 1s;/*변환효과 적용*/
    }

    /*로딩을 완료하면 로딩이미지를 감추기*/
    .loaded{
      opacity:0; 
      visibility: hidden;
    }

    /*콘텐츠 부분*/
    .gallery{
      max-width:1000px;
      width:100%;
      display:flex;
      flex-wrap:wrap;/*줄바꿈 허용*/
      padding:5px;
      margin:auto;
    }
    .gallery > .item{
      width:50%;
      padding:5px;
    }
    .gallery img{
      display:block;
      width:100%;
      height:300px;
      object-fit:cover;/*이미지의 가로세로 비율을 고정시킴*/
    }
  </style>
</head>
<body>
  <!--로딩 이미지-->
  <div id="loading">
    <img class="spinner" src="images/loading.png" alt="">
  </div>
  <!--콘텐츠(이미지갤러리)-->
  <div class="gallery">
    <div class="item"><img src="images/img1.jpg" alt="img1"></div>
    <div class="item"><img src="images/img2.jpg" alt="img2"></div>
    <div class="item"><img src="images/img3.jpg" alt="img3"></div>
    <div class="item"><img src="images/img4.jpg" alt="img4"></div>
    <div class="item"><img src="images/img5.jpg" alt="img5"></div>
    <div class="item"><img src="images/img6.jpg" alt="img6"></div>
    <div class="item"><img src="images/img7.jpg" alt="img7"></div>
    <div class="item"><img src="images/img8.jpg" alt="img8"></div>
    <div class="item"><img src="images/img9.jpg" alt="img9"></div>
    <div class="item"><img src="images/img10.jpg" alt="img10"></div>
    <div class="item"><img src="images/img11.jpg" alt="img11"></div>
    <div class="item"><img src="images/img12.jpg" alt="img12"></div>
  </div>

  <!--자바스크립트-->
  <script>
    //모든 리소스 불러오기가 완료되면 #loading에 loaded클래스를 추가해서 로딩아이콘을 감추기
    window.addEventListener("load",function(){
      //#loading 선택자
      document.querySelector("#loading").classList.add("loaded")
    })
  </script>
</body>
</html>
